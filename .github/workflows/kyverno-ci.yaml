name: Kyverno Policy CI

# Run on every push and pull request to main
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-policies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Kyverno CLI
        uses: kyverno/action-install-cli@v0.2.0

      - name: Verify Kyverno CLI is installed
        run: kyverno version

      - name: Validate all policies are well-formed
        run: |
          echo "Checking that every policy is syntactically valid and loadable..."
          for policy in policies/*.yaml; do
            echo "--- Validating $policy ---"
            kyverno apply "$policy" --resource tests/compliant-pod.yaml > /dev/null
            echo "OK: $policy loaded and evaluated without errors"
          done
          echo "All policies validated successfully."

      - name: Demonstrate enforce policies catch a bad pod
        run: |
          echo "Confirming the enforce policies detect violations in bad-pod..."
          # bad-pod violates enforce policies; kyverno reports failures (expected).
          kyverno apply policies/disallow-privileged-containers.yaml \
            --resource tests/bad-pod.yaml || echo "Violation correctly detected (expected)."

